<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tacet</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #4f8cff, #7c5cff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
      .sub { color: #8b949e; font-size: 13px; margin-top: -12px; }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #4f8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">🎙️</div>
      <h1>Tacet</h1>
      <div class="sub">Starting local server…</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
