name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Only the light deps the tests actually import — the heavy ML stack
        # (torch / whisper / speechbrain / onnxruntime) is never imported at
        # test time, so we skip installing gigabytes of wheels. See the header
        # of requirements-ci.txt for why.
        run: |
          python -m pip install --upgrade pip
          pip install -r web/backend/tests/requirements-ci.txt

      - name: Run backend tests
        env:
          # Repo root on the path so `import web.backend.*` resolves (web/ is a
          # namespace package — no web/__init__.py).
          PYTHONPATH: ${{ github.workspace }}
        run: pytest web/backend/tests/ -q

  frontend:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
